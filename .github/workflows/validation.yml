# Validation de chaque push et de chaque pull request
name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: Syntaxe PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Plus ancienne version encore courante chez les hébergeurs, puis les récentes
        php: ["8.1", "8.3", "8.5"]
    container: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@v4
      - name: php -l sur tous les fichiers
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || status=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $status
        shell: bash

  scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (avertissements et erreurs)
        run: |
          mapfile -t files < <(git ls-files '*.sh' '.githooks/*')
          shellcheck -S warning "${files[@]}"

  signatures:
    name: Aucun assistant signataire, aucune adresse IP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commits (messages et identités)
        run: bash .githooks/check-ai-names.sh range HEAD
      - name: Adresses IPv4 dans les fichiers (sauf 127.x et 0.0.0.0)
        run: |
          ipv4='(^|[^0-9.])((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]?)\.)((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){2}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])([^0-9.]|$)'
          if git grep -I -n -E "$ipv4" -- . ':!.github' | grep -v -E '(^|[^0-9.])(127\.[0-9.]+|0\.0\.0\.0)([^0-9.]|$)'; then
            echo "Adresse IP trouvée : à retirer"
            exit 1
          fi
